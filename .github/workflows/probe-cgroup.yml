name: probe-cgroup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-cgroup.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 探测 cgroup v2 与 memory 控制器
        run: |
          echo "--- /proc/self/cgroup ---"
          cat /proc/self/cgroup
          echo "--- cgroup.controllers ---"
          cat /sys/fs/cgroup/cgroup.controllers 2>&1 || true
          echo "--- subtree_control ---"
          cat /sys/fs/cgroup/cgroup.subtree_control 2>&1 || true
          echo "--- 能否在统一层级根下建子组 ---"
          D=/sys/fs/cgroup/probe-$$
          if mkdir -p "$D" 2>&1; then
            echo "mkdir OK"
            test -f "$D/memory.max" && echo "memory.max 存在" || echo "无 memory.max"
            echo 268435456 > "$D/memory.max" 2>&1 && echo "写 memory.max OK" || echo "写 memory.max 失败"
            rmdir "$D" 2>&1 || true
          else
            echo "mkdir FAILED（只读或无权限）"
          fi
          echo "--- 能否在进程自己的 cgroup 之下建子组 ---"
          OWN=$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup)
          echo "own=$OWN"
          if [ -n "$OWN" ] && [ "$OWN" != "/" ]; then
            D2=/sys/fs/cgroup$OWN/probe-$$
            mkdir -p "$D2" 2>&1 && echo "own-mkdir OK" || echo "own-mkdir FAILED"
            rmdir "$D2" 2>/dev/null || true
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: 跑本仓的探测用例（看是跑还是跳）
        run: |
          go test ./ptc/ -run 'TestSubprocessMemoryLimitKillsChild|TestMemoryLimitFailsClosed|TestSubprocessProviderWithMemoryConfigured' -v 2>&1 | tail -30
