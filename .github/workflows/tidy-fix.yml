name: tidy-fix

# 临时工作流：本地沙箱禁止 rename(2)，go 的模块缓存无法落盘，
# 因此借 CI runner 跑一次 go mod tidy 并把结果作为 artifact 回传。
# 用完即删。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: diff
        run: git --no-pager diff --stat go.mod go.sum

      - uses: actions/upload-artifact@v4
        with:
          name: tidied
          path: |
            go.mod
            go.sum
