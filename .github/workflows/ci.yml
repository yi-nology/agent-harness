name: ci

# 门禁的检出能力由 CI 持续保证：本地跑不动 make check 不等于合规，
# 反向验证样本也不该常驻仓里（见 .gitignore 的说明段）。
#
# 门禁本体**全部在 make check 里**，CI 只是执行它。这不是偷懒，是刻意的：
# 门禁若只挂在 ci.yml 上，本地开发者要到推送之后才知道自己违规——那就不是
# 「提交前门禁」而是「推送后门禁」了。仓库卫生门禁（go.mod 不得含 replace /
# go.work 不得入库 / README 包表一致）原先正是在 ci.yml 里，现已一并搬进
# make check，规则与理由见 Makefile 对应 target。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # windows job 真跑测试（issue #34 建议 1）：交叉构建只能证明编得过，
  # procx 这类进程原语要证明跑得对必须真执行。范围全仓——unix 专属用例
  # 以 //go:build unix 守卫（与上游 procx 的做法一致），windows 侧用例
  # 用 cmd 形态的夹具。runner 用 windows-latest（无钉死 major.minor 的
  # 镜像迁移公告，若有按 check job 的口径另行钉死）。
  windows-test:
    name: windows (真跑测试)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test ./... -count=1

  check:
    # job 名不得超长：GitHub 会截断超 100 字节的名字，于是分支保护的
    # required context 永远匹配不上 ⇒ 每个 PR 都卡在 BLOCKED 且看不出原因。
    # 长度门禁见 Makefile 的 cijobname 目标；改这个名要同步改分支保护。
    name: check（fmt+vet+lint+test+cover-gate+vuln+race+crossbuild+archcheck+卫生）
    runs-on: ubuntu-24.04
    # 为什么钉死不用 ubuntu-latest：GitHub 公告该标签自 2026-10-19 起迁移到
    # Ubuntu 26，迁移后 runner 镜像的 Go/工具链环境可能与本机不同——门禁在
    # 「与开发者不同的镜像」上跑，绿灯的可信度要打折。钉死 major.minor 让
    # 迁移变成一次显式的、可 review 的升版动作，而不是某天突然换底座。
    # 升级动作：同时改本行与本仓需要的 Go 版本验证。
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # 版本跟随 go.mod 的 go 指令，避免两处各写一份然后悄悄漂移。
          go-version-file: go.mod
          cache: true

      # 只负责把二进制装进 PATH，**不在本 step 里跑 lint**——
      # 规则本体在 Makefile 的 lint target 里（已接进 make check）。
      # 在这里再跑一遍就是「门禁本体在 ci.yml」，与本文件开头写的那条相反。
      #
      # 版本钉 v2.14.0：与本地验证过的版本一致。本机装的是 v2.15.0 时，
      # CI 与本地可能出现不同的判定结果——那种差异应该在升级本行时
      # 显式发生，而不是随某台机器的 brew upgrade 悄悄发生。
      #
      # ⚠️ 若将来升级 go.mod 时上游发生过 tag 重写（oagentkit/oekit 的
      # 历史标签被移动或删除），必须先清本仓的 setup-go 缓存再推，
      # 否则 restore-keys 前缀回退会恢复重写前的模块副本，报
      # checksum mismatch 而本地全绿。详见 README 提交前检查段。
      - name: 安装 golangci-lint（make check 的 lint 门禁需要）
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/golangci-lint" --version

      # 同 lint 的分工：这里只装二进制，判定在 Makefile 的 vuln target 里。
      # 版本与 Makefile 的 GOVULNCHECK_VERSION 保持一致（两处各写一份，改一处要
      # 同时改另一处——门禁的值写死在两处会漂，但把版本塞进 Makefile 再让
      # ci.yml 读它，会让「装什么版本」变成 shell 解析 Makefile 的脆弱动作）。
      - name: 安装 govulncheck（make check 的 vuln 门禁需要）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/govulncheck" -version

      # Makefile 已内置 CGO_ENABLED=0；Linux 上同样适用，不覆盖。
      #
      # 唯一例外是 race 目标：Linux 上 `-race requires cgo`（实测），故它在
      # Makefile 里单独用 RACE_ENV=CGO_ENABLED=1。ubuntu runner 自带 gcc，
      # 无需额外安装；若某天镜像去掉编译器，这条门禁会**明确变红**而不是
      # 静默跳过——这正是要的形态。
      - name: make check
        run: make check

  # PG 参考实现的 integration 层（issue #94 #95）：共享契约套件
  # （sidetest / boardtest / 栅栏套件）+ SIGKILL 故障恢复 e2e 在真实
  # PostgreSQL 上跑。为什么是独立 job 而不是塞进 make check：check 必须在
  # 任何机器上一条命令可跑（不依赖 docker），而这里的判据要真的连数据库。
  # 判据强度不变——套件场景级硬失败不静默跳过；service container 保证
  # CI 每次推送都真跑（本地等价入口：make integration / compose verify profile）。
  integration-pg:
    name: PG 契约套件 + SIGKILL e2e（postgres service）
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gakref
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gakref"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: PG 契约套件 + 故障恢复 e2e（硬失败，无环境开洞）
        env:
          GAK_PGREF_DSN: postgres://postgres:postgres@localhost:5432/gakref?sslmode=disable
        run: |
          CGO_ENABLED=0 go test ./examples/pgstore/ -count=1 -timeout 15m -v
