name: ci

# 门禁的检出能力由 CI 持续保证：本地跑不动 make check 不等于合规，
# 反向验证样本也不该常驻仓里（见 .gitignore 的说明段）。
#
# 门禁本体**全部在 make check 里**，CI 只是执行它。这不是偷懒，是刻意的：
# 门禁若只挂在 ci.yml 上，本地开发者要到推送之后才知道自己违规——那就不是
# 「提交前门禁」而是「推送后门禁」了。仓库卫生门禁（go.mod 不得含 replace /
# go.work 不得入库 / README 包表一致）原先正是在 ci.yml 里，现已一并搬进
# make check，规则与理由见 Makefile 对应 target。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: fmt + vet + test + cover-gate + archcheck + repo 卫生
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 版本跟随 go.mod 的 go 指令，避免两处各写一份然后悄悄漂移。
          go-version-file: go.mod
          cache: true

      # Makefile 已内置 CGO_ENABLED=0；Linux 上同样适用，不覆盖。
      - name: make check
        run: make check
