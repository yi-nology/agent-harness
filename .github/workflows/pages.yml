name: pages

# 站点发布流水线：从 README / go.mod 生成介绍页，部署 GitHub Pages。
#
# 与 ci.yml 的分工同源：门禁判「内容合不合规」（make check），这里只负责
# 「把合格的内容发出去」。站点上的每个数字都由 site/build.py 从 README 与
# go.mod 读取（读不到即报错退出），所以触发条件就是这两个**输入**的变更——
# 改了代码没改 README 的推送不必重新生成，数字不变。
#
# 发布源 = GitHub Actions（build_type: workflow）。2026-11-11 起站点源码
# 从 gh-pages 分支迁回 main 的 site/，gh-pages 分支冻结为历史归档，
# 不再接收构建产物——线上站点是它迁走前的最后一版，只作对照。
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一时刻只保留一次发布：新推送直接取代在途的旧发布，不排队堆积。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 生成站点（数字从 README / go.mod 读）
    # 钉 major.minor 与 ci.yml 同口径：迁移要显式升版，不随镜像标签悄悄换底座。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 提前失败：Pages 未配置成「GitHub Actions」发布源时，报错落在构建这一步，
      # 而不是部署时给一个含糊的 404。
      - uses: actions/configure-pages@v6

      - name: 生成 index.html（build.py 读不到数字即报错退出）
        run: python3 site/build.py . _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: 部署 GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # 创建 Pages 部署
      id-token: write   # OIDC：证明这次部署来自 main 上的本工作流（环境规则可强制）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
