name: pages

# 站点发布流水线：VuePress 文档站从仓库事实生成并部署 GitHub Pages。
#
# 与 ci.yml 的分工同源：门禁判「内容合不合规」（make check），这里只负责
# 「把合格的内容发出去」。站点上的每个数字由 site/gen.mjs 从 README、go.mod、
# architecture-policy.yaml、Makefile、docs/USAGE.md 读取（读不到即构建失败），
# 所以触发条件就是这些**输入**的变更——改了无关代码的推送不必重新生成。
#
# 发布源 = GitHub Actions（build_type: workflow）。gh-pages 分支是历史归档
# （2026-11-11 迁回 main 前的最后一版），不再接收构建产物。
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'architecture-policy.yaml'
      - 'docs/USAGE.md'
      # ADR 是站点决策记录页的**唯一真相源**（site/gen.mjs 从 docs/adr/ 投影）：
      # 不列进触发路径，改了 ADR 站点就不会重建——读者看到的推导会停在旧版本。
      - 'docs/adr/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一时刻只保留一次发布：新推送直接取代在途的旧发布，不排队堆积。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 生成站点（VuePress 构建，数字由 gen.mjs 从仓库读）
    # 钉 major.minor 与 ci.yml 同口径：迁移要显式升版，不随镜像标签悄悄换底座。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Node 版本钉 24（LTS）：VuePress 2 要求 Node >= 18，取 LTS 不取 latest。
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # 提前失败：Pages 未配置成「GitHub Actions」发布源时，报错落在构建这一步，
      # 而不是部署时给一个含糊的 404。
      - uses: actions/configure-pages@v6

      - name: 构建（gen.mjs 先生成机器事实页，解析失败即退出）
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/docs/.vuepress/dist

  deploy:
    name: 部署 GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # 创建 Pages 部署
      id-token: write   # OIDC：证明这次部署来自 main 上的本工作流（环境规则可强制）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
