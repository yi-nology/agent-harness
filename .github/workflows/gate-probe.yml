name: gate-probe

# 临时工作流：本地沙箱禁止 rename(2)，go 模块缓存无法落盘，跑不了门禁。
# make check 是串行的，test 失败会挡住 cover-gate 与 architecture-check，
# 故此处拆开单跑，以确认后半段门禁的实际状态。用完即删。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: cover-gate
        run: make cover-gate

      # cover-gate 内部跑 go test，pii 的 panic 会让它提前退出、算不出覆盖率。
      # 这里容错跑一遍，只为拿到总覆盖率数字，与 COV_MIN=60 对照。
      - name: coverage number (tolerant)
        if: always()
        run: |
          CGO_ENABLED=0 go test ./... -coverprofile=coverage.out -count=1 >/dev/null 2>&1 || true
          echo "total: $(go tool cover -func=coverage.out | tail -1)"

      - name: architecture-check
        if: always()
        run: make architecture-check

      - name: architecture-check full report
        if: always()
        run: go run ./cmd/archcheck --report
