# goagent-kernel 架构治理策略
#
# 双面设计：本文件既是「声明面」（模块清单 + 依赖方向 + owner，供人阅读与 AI 对齐），
# 也是「可执行面」（rules 段由 archcheck 包逐条执行，`make architecture-check` 门禁；
# 违反即非零退出）。正则一律 RE2 语法（Go regexp 原生，不支持 (?!...)——
# 负向前置用 negative_follow 结构化表达）。
#
# ── 与宿主仓的 architecture-policy.yaml 的分工 ──
# 本仓管「harness 不得长出领域知识」+「harness 内部依赖方向」；
# 宿主仓管「宿主不得上溯 harness」+「领域包治理」。两边互不覆盖，
# 合起来才构成完整红线（拆分后最怕的就是半年后业务代码慢慢渗回内核）。
#
# 纪律：
#   - 提交前跑 `make check`（本仓的 verify 聚合）；
#   - 新依赖方向先改本文件再写代码（policy 先行）；
#   - 新模块登记 {id, roots, requires, owner} 三元组；
#   - 例外必须带注释说明原因与拆除条件。

version: 1

# 每条**有执行体**的规则必须自带 examples（正例/反例），加载期自检。
#
# 为什么本仓开 true 而缺省值是 false：这条口径若只写在注释里就是散文。
# 规则会随词表改名、module 路径迁移而**静静地不再命中**——它照常编译、照常参与
# 报告、severity 照常是 error，唯独一件事都判不了。测试能证明「今天它还判得动」，
# 但测试在 CI 里跑一次；examples 在**每一次**门禁运行时跑，包括别人复用了这份
# 判据的宿主仓。
#
# 对复用方的缺省保持 false：强制补样例会让一次「升级判据」变成一次「策略改写」。
require_rule_examples: true

# ── 模块清单（requires = 允许的内部依赖方向）──
modules:
  - id: protocol
    roots: [protocol]
    requires: ["ext:github.com/oekit/pkg"] # 统一报告协议 + 宽容解析 + 结构化校验：机制层叶子包，零内部依赖
    owner: harness
    managed: true
    notes: |
      Report 结构含少量宿主填充的领域味字段（如 symptom 首句的检测对象标注）。
      该味**只存在于字段注释与格式约定**，不引入任何领域词表或判定逻辑——
      字段本身是通用字符串。域约束应落在宿主的 prompt/包声明里，不落进本包代码。

  - id: statemachine
    roots: [statemachine]
    requires: []
    owner: harness
    managed: true
    notes: 环节状态机：条件迁移的纯函数件，零依赖

  - id: eventbus
    roots: [eventbus]
    requires: ["ext:github.com/oagentkit/runtime"]
    owner: harness
    managed: true
    notes: 进程内有损广播（缓冲 chan）；持久化在发布点由宿主负责

  - id: policy
    roots: [policy]
    requires: ["ext:github.com/oagentkit/toolgate", "ext:github.com/oagentkit/guardx"]
    owner: harness
    managed: true
    notes: |
      操作审计门：阈值只降不升、解析失败即拒。
      guardx 是为 Stage 的返回类型（invoke.Stage）而登记的——签名所需，非实现。

  - id: spill
    roots: [spill]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: 输出预算溢出：提示契约/取回/按龄清理，宿主与前端共用判据

  - id: pii
    roots: [pii]
    requires: [subhub, "ext:github.com/oekit/pkg"] # 策略变更订阅表复用 subhub（快照式订阅的单一实现）
    owner: harness
    managed: true
    notes: 个人信息价值面脱敏（正则），与宿主日志脱敏面互补

  - id: netguard
    roots: [netguard]
    requires: [subhub, "ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"] # 策略变更订阅表复用 subhub（快照式订阅的单一实现）
    owner: harness
    managed: true
    notes: 出站 URL 守卫（SSRF），纯 stdlib 叶子层

  - id: dispatch
    roots: [dispatch]
    requires: ["ext:github.com/oagentkit/agent"]
    owner: harness
    managed: true
    notes: |
      派发守卫（权限即拓扑的机制面）。拓扑数据经 EdgeSource 由宿主提供，
      本包不认识任何具体 agent——「全拓扑只有一条边能到达执行器」是宿主的
      产品级安全不变量，其断言测试留在宿主仓，本包只测机制。

  - id: contract
    roots: [contract]
    requires: []
    owner: harness
    managed: true
    notes: |
      编排运行契约：编排引擎与宿主状态之间的**唯一边界**（纯接口面，零实现）。
      L2 抽取在 flowEngine 处撞到的硬墙是「宿主状态模型带领域语义」——
      contract 是那道出口：编排语义字段定死在接口上，领域字段走开放键。
      零内部依赖、零外部依赖，故 requires 为空。

  - id: checkpoint
    roots: [checkpoint]
    requires: [contract, "ext:github.com/oekit/pkg"] # 只为复用 contract 的编排状态常量，避免终态语义被定义两次而漂移
    owner: harness
    managed: true
    notes: |
      编排续跑契约：进度快照的存取边界 + 「续跑而非重放」的恢复判定机制。
      「编排是代码」的必然推论是「崩溃后能接着跑」——此前本仓把编排状态全押在
      宿主 DB 上（eventbus 注明「持久化在发布点由宿主负责」），内核自己回答不了
      「这一步执行到哪了、重启后该从哪继续」。本包把这个选择做成可机械判定的纯函数，
      而不是留给宿主在崩溃那一刻临场决定（临场决定必然选最坏）。
      领域字段走开放键，与 contract 同口径。

  - id: budget
    roots: [budget]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      上下文预算：分段计量 + 窗口钳位 + 「压实而非丢弃」的压实计划骨架。
      本仓原有 spill 只管**输出**超预算；输入侧的上下文计量此前完全缺位。
      摘要生成与原文落盘各留一个接口由宿主实现（内核不自己调 LLM、不碰存储）——
      与「LLM 只做单环节」「编排只认接口」同一条纪律。

  - id: offload
    roots: [offload]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      内联大对象外置：把 base64 二进制从每轮重发的历史里换成占位文本。
      与 spill 是姊妹机制但语义不同——spill 管文本输出溢出，offload 管
      「二进制本体躺在消息里」。两阶段（首次标记、后续轮才替换）是正确性关键：
      首次就替换会让模型永远看不到该对象。

  - id: tooldisclose
    roots: [tooldisclose]
    requires: [toolname, "ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"] # 派生调用形态时的函数名规整，与 ptc 共用同一套规则
    owner: harness
    managed: true
    notes: |
      渐进式工具披露 + 执行门禁。工具一多，tool_definitions 自己就吃满上下文，
      故先只暴露「名字+描述」占位，按关键词检索换完整 schema。
      门禁的核心是把两类失败严格区分开：未加载（可重试，顺手激活）与
      不在目录（不可重试，明确禁止绕过）。目录与打分均为确定性，编排才可复现。

  - id: toolfail
    roots: [toolfail]
    requires: ["ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      工具失败的错误分类契约：瞬时/永久/鉴权/未找到/权限/参数非法/限流，
      另加「自报」类：错误自报 Retryable() bool 时按其结论归类，避免
      「该不该重试」在两个包各判一次且判出相反答案。
      各自带可重试性与退避建议。
      本仓此前只有 policy 的「解析失败即拒」，没有「失败是否可重试」这层语义——
      上层要自动退避就必须能机械判定，故单独立一个契约包。

  # L2 第二批机制包（随包下沉登记）。requires 反映**真实**依赖方向，不是「理想形态」：
  # watchdog 确实读 eventbus，就写 eventbus。此前这里写的是 requires: [] 并附一句
  # 「同仓叶子引用不算模块间方向约束」——那是给自己开的口头豁免，且因为 requires
  # 从未被执行过，连漂移都没人发现（执行体见 archcheck/deps.go）。
  - id: ptc
    roots: [ptc]
    requires: [toolname, sandbox, egress, "ext:github.com/oagentkit/guardx", "ext:github.com/oagentkit/runtime", "ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg", "ext:github.com/oekit/logx"] # guardx 含 sandbox/wire（跨进程协议） # runtime/procx 管「子进程能看见什么环境」（白名单，非全量继承）；工具名→JS 标识符的规整规则，唯一的真相在 toolname 包；sandbox 是执行档位与后端协议
    owner: harness
    managed: true
    notes: 程序化工具编排沙箱（goja VM，三重预算替代 OS 沙盘）

  # 2026-10-21 新增：执行沙箱的**档位语义**与**后端协议**。
  #
  # 为什么值得单开一个包：「模型写的程序在哪跑、跑起来能触达什么」此前在本仓只有
  # 一个答案——ptc 的进程内 goja VM——而那个答案是**写死在调用点**的：没有档位概念，
  # 也没有「这次执行至少要多强」的表达。于是宿主想跑一个不可信程序时，
  # 「它跑在够强的隔离里吗」这件事无处声明，只能靠人记得别挑错后端。
  #
  # 本包把「隔离强度」变成**可声明、可判定**的机制：
  #   - Level：档位（进程内解释器 → 内核级 → 硬件虚拟化），单调可比；
  #   - Provider：后端协议（自报提供哪一档，并执行程序）；
  #   - Registry：登记簿 + 按要求档位选择，**选不到就拒绝，不降级**。
  #
  # 「不降级」是本包的核心语义：要求档位若在无满足者时被悄悄换成弱后端，
  # 这套机制就是装饰——宿主写下的「本次要内核级」与实际发生的「进程内跑」之间
  # 没有任何信号，差的那个量级就是全量暴露。
  #
  # 边界：档位语义属于内核；「哪些执行要哪一档」属于宿主（那是风险判断，
  # 不是机制）；后端实现可以在宿主侧（本包只认协议）。
  - id: sandbox
    roots: [sandbox]
    requires: ["ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      执行沙箱的档位语义与后端协议：Level（隔离档位，单调可比）+ Provider（后端
      协议）+ Registry（登记簿，按要求档位选**最弱**满足者，无满足者即拒绝）+
      EgressMode/EgressEnforcer（出站档位词表与可选能力声明——词表必须低于所有
      实现方，否则上游后端无法实现该接口）。
      零内部依赖——它是叶子层，ptc 反过来依赖它（适配器方向只能是 ptc → sandbox：
      沙箱机制不认识任何后端，后端认识沙箱）。

  - id: watchdog
    roots: [watchdog]
    requires: [eventbus]
    owner: harness
    managed: true
    notes: |
      工具调用配对不变量监视，只告警不裁决。依赖 eventbus 是为了在检测到
      「声明未执行 / 执行未声明」时把异常广播出去——配对不变量违反了却无人知晓，
      等于没有监视。

  - id: delta
    roots: [delta]
    requires: ["ext:github.com/oagentkit/runtime"]
    owner: harness
    managed: true
    notes: 增量节流：(kind,iteration) 键控 + 权威整段优先 + 确定性收口扫序

  - id: pending
    roots: [pending]
    requires: []
    owner: harness
    managed: true
    notes: 多轮挂起态载体：单一编码入口 + 宽容解码

  - id: sideeffect
    roots: [sideeffect]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      副作用「至多一次」的跨进程契约：幂等键（同一逻辑动作重试不重复施加）+
      租约（同一资源独占，带 TTL）+ 栅栏令牌（过期持有者的迟到写入被下游拒绝）+
      下游拒收契约（FencedSink：比较与写入须同一次原子操作）。
      零内部依赖——它是叶子层。宿主实现 Store 接口落库，判据归内核。

  - id: sidetest
    roots: [sidetest]
    requires: [sideeffect, "ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      sideeffect.Store 的共享契约测试套件：宿主写完存储实现后跑一遍，
      违反哪条契约就红在哪一条——免得「各写一遍必然各判一套，漂移到没人发现为止」。
      依赖 sideeffect 是因为要 import 它的契约类型（套件判的是它的实现）。

  - id: retryplan
    roots: [retryplan]
    requires: ["ext:github.com/oagentkit/guardx"]
    owner: harness
    managed: true
    notes: |
      重试处置决策：把「该不该重试」（toolfail 判）与「重试会不会重复施加」
      （sideeffect 判）合成一条可执行结论——三档路径（不重试 / 原样重发 /
      走幂等键重放）。与 guardset 同族：**组合逻辑归内核，判定归各自机制**。
      零内部依赖（不 import sideeffect：两者是契约上的衔接，不是代码耦合）。

  - id: preset
    roots: [preset]
    requires: [egress, gatecheck, policy, sandbox, "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      命名权限预设：把「隔离档位 × 审批模式 × 出口策略」三件散参数收成一份**具名、
      不可变、可自检**的整份配置。

      补的是「零件齐了但组装件没有」。三面的零件本仓都有（sandbox.Level /
      policy.Mode / egress.Spec），但每次执行由宿主自己拼，而拼错不会报错：
      档位传成零值 ⇒ 沙箱层不构成约束而调用点看起来「声明了档位」；出口漏传 ⇒
      零值即「不要求」而这次执行自由出网；两个参数配成互不相容的组合 ⇒ 没有任何
      一处会对此说一句话。

      自检项里最关键的一条是「**三面全松必须显式承认**」：档位 none × 模式 full ×
      出口不限时必须写 Unsafe 与理由。目的不是拦住这个决定，而是让它留下签字——
      否则它就变成「反正先跑起来」留下的、没人认领的松口。

      另一条是「语义相同的两个名字要报错」：两个名字一份组合在配置里看起来是
      「两个选择」，真正的伤害在留痕——报告里出现两个名字，读者会以为执行过两种权限。

      Resolve 遇到未登记名字**报错而不降级**：降级到缺省的方向不可预测（可能更松），
      而「打错一个字就用上另一档权限」没有任何信号。

  - id: cmdpolicy
    roots: [cmdpolicy]
    requires: ["ext:github.com/oekit/pkg", "ext:github.com/oagentkit/tools"]
    owner: harness
    managed: true
    notes: |
      命令级判据：把判定面从「工具调用」向下延伸到「工具内部实际执行的那条命令」。

      此前判定边界停在工具名上：一次 tools.exec 被审批通过之后，它内部跑的是
      git status 还是 rm -rf / 没有任何机制面看得见。宿主只能用正则黑名单兜，
      而黑名单在「写法与语义不一致」时必然失效（多空格、变量拼接、子命令替换）。
      本包改用**前缀 token 规则**：先分词再比 token，判据不随引号/转义/空白漂移，
      且拒绝理由可解释、能直接回给模型。

      三态裁决（allow / prompt / forbidden）与 toolgate 的裁决词表同义，不引入
      第二套口径——prompt 直接接 gatecheck 的「需人审」档。

      **规则自带样例，加载即自检**：每条规则可带 Match / NotMatch，New 在加载期
      用真实判定路径跑一遍，不一致即报错。这是「从没见过它触发的规则等于没有规则」
      那条纪律的机器化——规则会随命令名漂移，而漂移不会报错，只会静静地不再命中。

      SplitCommands 单独存在是因为前缀判据有一个典型绕过："git status; rm -rf /" 的
      前缀是 git，对整串只判一次就会让一条 git 的 allow 规则放行后半段。

      **分词面归上游**（2026-11-11 收编）：分词是 oekit/pkg/shellx.Split，段文本拼装是
      shellx.QuoteArgv（它的逆运算，保证段可往返）。本仓不再维护第二份分词口径——
      口径只有一处真相，且 POSIX 细节（双引号内反斜杠、分隔符合并、CR 归空白）
      由上游维护。判据面（前缀规则 / 三态裁决 / 样例自检）仍归本仓。

      **事实面归上游**（2026-11-11 收编）：「这条命令里出现了什么」（全调用集、
      全重定向集、动态词）走 oagentkit/tools/bashguard 的真 shell AST（mvdan.cc/sh），
      本仓不手写 shell 解析器。前缀判据的三类典型绕过（多段 / 命令替换 / 写重定向）
      由「全调用面取最严 + 事实面下限（写重定向、动态展开 ⇒ 不低于 prompt）」闭合。
      bashguard 的只读/不可逆风险分级是另一套语义，本包不用。

  - id: egress
    roots: [egress]
    requires: ["ext:github.com/oekit/pkg", sandbox]
    owner: harness
    managed: true
    notes: |
      出口策略：三档（不限制 / 只经代理 / 完全禁网）+ 声明自检 + 兑现判据。

      本包**不含代理本体**（那是上游 guardx 与宿主的活）——它只回答三件此前没人回答
      的事：①这次执行要求哪一档出口；②宿主给的环境变量是否**真的**兑现了那一档；
      ③某个沙箱后端能不能兑现它。

      依赖 sandbox 只是为**类型同一**：出口档位词表与能力声明契约的真相在
      上游的 guardx/sandbox（EgressMode / EgressEnforcer），本包用 type alias 指过去。
      为什么不能在本包定义词表：Go 的接口一致性要求返回值类型同一，词表留在本包则
      上游任何执行后端要声明「我能兑现」都得 import 本仓 ⇒ 成环 ⇒ 那条接口在结构上
      只可能由宿主实现，且编译期不报错。实测代价是一整条出口声明链空转一轮。

      底层的判据是「**沉默按最弱处理**」：后端不声明 Enforcer 就视为不限制，
      而不是视为满足——否则一个从没实现过出口控制的后端会因为「没说不支持」而被
      选中，声明与实际之间的落差没有信号。

      **禁网档拒绝伪造**：ModeDenied 的 Env/Verify 直接报错而不是「尽力而为」。
      假装禁网比明确拒绝更危险——报告会显示「已兑现」，而网络其实通着。

  - id: gatecheck
    roots: [gatecheck]
    requires: [egress, "ext:github.com/oagentkit/guardx", "ext:github.com/oagentkit/toolgate", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      审批层与沙箱层的**联合判据**：Codex 的两层安全模型是「沙箱强制 +
      审批策略，两层都同意才放行」。上游 guardx/sandbox（档位×预算）与
      toolgate/policy（审批裁决）各自完整但**互不知情**，「两层是否都同意」
      这个判定没有单点——落在各宿主手里必然漂移。本包只做**合成**，
      不重新实现任何一层（那会造成与上游并存的第二份真相）。

  - id: taskboard
    roots: [taskboard, taskboard/boardtest]
    requires: ["ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      多 agent 协调面的**存储中立契约 + 一致性判据**（P1-4）。

      dispatch 只回答「能不能派」。派出去之后的三件事——谁负责哪个子任务、
      它依赖谁、怎么把认领还回去——此前没有任何机制面：各宿主自己拿一张表
      兜着，于是「同一子任务被两个 agent 同时认领」这种错在报告里读起来
      完全正常（两条分支都干完了活，各自都以为自己是负责人）。

      本包**不给存储实现**：表结构、事务边界、持久化形态是宿主资产，给一份
      参考实现宿主就会照着改它，最后两份真相并存（与 checkpoint.StoreCAS
      同一条分工）。给的是三样：Board 接口、快照不变量判据（Check，纯函数）、
      并发正确性判据（ConcurrentClaim，返回成功者数量而不是「测过没」）。

      三条口径值得单说：① 认领必须**原子**由存储保证，本包只判结果；
      ② 释放/完成**凭令牌不凭内容**（同名 agent 与「失败→释放→重试」都会让
      内容比对认错人，这是 commitgate 踩过的坑）；③ **failed 不是终态**
      （一次失败不能把子任务永久钉死，否则宿主的补救路径静默失效）。

  - id: skilldisclose
    roots: [skilldisclose]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      技能披露：确定性挑出该给模型看的那几个技能（P2 里唯一立刻可做的一项）。

      与 tooldisclose 的分工不是「重复」：tooldisclose 的检索键是**工具调用需求**，
      而技能的触发信号有三种且**强度不同**——点名 > 资源命中 > 描述相关。
      混成一个分数会让「相关」压过「点名」，而那正是用户已经明确表达过的意图。

      三条判据：点名权重必须高于任何相关度信号；同分按名字（不依赖 map 顺序）；
      预算裁剪必须显式（静默截断会让宿主以为「就这几个相关」）。空结果必须
      写明原因——「没有检查」与「检查通过」在调用方看起来一样。

  - id: hookengine
    roots: [hookengine]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      Hooks 的**判定面**：什么时候该跑、跑了算不算拒绝（P2 里最需要划边界的一项）。

      Codex 是「外部进程协议 + 规则文件」，DSH 是「动态插件包」——形态**已经分叉**。
      此时由内核定一种形态等于替宿主选边（把传输/加载焊进契约），故只定三件跨形态
      恒定的事：匹配、裁决、顺序与收口。传输与加载归宿主（Runner 是唯一接缝）。

      两条 fail-closed：阻塞 hook 执行失败 ⇒ deny（跑不起来不等于没问题）；
      超时的裁决必须显式声明（缺省 deny），否则超时会被 ctx 取消掩盖成「这次没拒绝」。
      非阻塞 hook 不参与裁决但失败必须留痕——它一旦能影响裁决，就只是「慢的阻塞 hook」。

  - id: memorypipe
    roots: [memorypipe]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      记忆注入的三段：**注入 / 引用 / 打标**（读写时机归宿主，与 budget 的 Summarizer
      同一条边界——内核不替宿主决定「这次值不值得记住」）。

      注入侧有三件事与策略无关、各宿主各写一遍又必然各判一套：① **来源是前提**
      （没有来源的记忆与模型的猜测在文本上无法分辨 ⇒ 不注入、显式丢弃并说明）；
      ② **逐条打标**（id/source/at 三样缺一就少一条追溯路径）；③ **裁剪显式**。

      scope 精确匹配、**不做父级兜底**：按 project 查却回退到 global 看起来更友好，
      代价是作用域失去意义——只该在某个项目里生效的记忆会在任何会话里生效，
      而报告完全正常。

  - id: delegate
    roots: [delegate]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      异构委托的**契约面**：请求能不能交出去、交出去算不算完成（P2 里的协议面）。

      ACP 一类的东西同时是**协议 + 传输**，线格式归上游；本包只定跨传输恒定的三条：
      ① 能力必须**子集**（做不到就拒，不许「尽力而为」——尽力而为的结果无法判定
      「没做到」与「本来就没要求」）；② **最小能力原则**选执行方（多个都能接时取能力
      最少者；按顺序取第一个会让一次无关的配置重排换掉执行方）；③ 回执状态**三值**
      （把「被拒绝执行」混进「执行失败」会让委托方去修一个不存在的 bug）。

  - id: worktree
    roots: [worktree]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      工作区隔离的**声明面与冲突判据**（不碰真实文件系统——本仓至今不碰 FS 语义）。

      并行工作区会不会互相踩这件事此前没人判：两个 agent 各自「在自己的目录里工作」，
      而可写区完全重叠时，任何一边的写入都会让另一边的结论失效，报告里却只有两份
      「各自成功」。故本包判三件：声明自检（同一工作区不得既只读又可写）、
      **可写区重叠即冲突**（只读重叠不算）、无命中即不可读写（fail-closed——
      默认允许会让漏写的一行声明变成全域可写）。

      **不支持通配**（写明的局限）：* 与 ** 的语义各实现不同，进契约就会出现
      「按 A 的理解写、按 B 的理解判」。需要更强表达力时宿主自己展开成多条精确声明。

  - id: reminder
    roots: [reminder]
    requires: ["ext:github.com/oagentkit/guardx"]
    owner: harness
    managed: true
    notes: 系统注入提示的防伪包裹（source 声明 + 伪造标签转义）

  - id: sessionref
    roots: [sessionref]
    requires: [reminder, "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      跨会话引用快照：把「另一个会话的结论」以**有界、带来源、带失效点**的片段
      注入当前上下文，并把「新鲜度」变成可机械判定的一维。

      它补的是 budget / spill / offload 都不管的那一段：三者回答的都是「**同一份
      上下文**里内容放不下怎么办」，而「引用另一个会话的结论」是另一件事——那份
      内容不在当前上下文里，它的边界与保鲜度没有任何机制面管。不管的后果不是
      「引用得不好」，是把**当时的**结论当成**现在的**结论用，而这类错误在报告里
      读起来完全正常（那段话当时确实是真的）。

      三条判据都走结构而非约定：① 裁剪上限在采集时给定，且裁剪了必须显式标出
      （@Truncated@ + @OriginalBytes@，外加注入面的 @truncated=true@）——静默截断
      会让模型以为看到的是全文；② @Source@ / @SourceVersion@ / @CapturedAt@ /
      @ExpiresAt@ 随快照走，失效判定只需「现在几点 + 源现在第几版」；③ 渲染时
      把 @state=fresh|expired|stale@ 写进包裹体。

      版本这一维不可省：TTL 是**采集者猜的**，源是否前进是**事实**，长 TTL + 高频
      源更新是最常见的失效形态，只靠时间会一路判有效。版本**回退**同样判 stale
      （同一个 id 指向的已不是同一段历史）。两者同时成立时报 expired：时间已过是
      宿主必须无条件重采的那条。

      渲染**不拒绝、只标注**：拒不渲染会让「引用过期」变成「引用消失」，宿主无从
      区分「本来就没引用」与「引用了但过期」。防伪不另写一套——走 @reminder.Wrap@
      统一包裹（防伪实现只允许一份）。

  - id: drain
    roots: [drain]
    requires: ["ext:github.com/oekit/logx", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: 优雅排水：轮 ctx 取消脱钩 + 等在途收敛 + 预算耗尽强制收刀

  - id: commitgate
    roots: [commitgate]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      环节终态独占提交闸：同一 (run, 环节) 的终态只允许被提交一次。
      statemachine 是纯谓词、checkpoint 只排快照序号，两者都排不出
      「两条并行分支都赢了」——那条边界只有独占提交闸能表达。
      本条登记是 2026-10-18 依赖方向门禁落地时补的：包早已存在并被 docsync
      计入 README 包表，却从未进过 modules 段，故对本门禁隐形（依赖方向无人判定）。

  - id: guardset
    roots: [guardset]
    requires: [subhub, "ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"] # 换份订阅表复用 subhub（快照式订阅的单一实现）
    owner: harness
    managed: true
    notes: |
      守卫装配契约：一组相互独立的判定一并求值，多条拒绝合成一条。
      接进 oagentkit/toolgate 的 invoke 链作为单独一环——链本身由上游负责，
      本包只补它按设计不覆盖的那一面（链在第一个拒绝处就收口，后面的守卫没机会说话，
      模型一次只听得到一个理由）。
      不重复实现链：顺序执行、留痕、panic 兜底全部沿用 invoke.Chain。

  # 2026-10-19 新增：工具名→JS 标识符的规整规则，收成单一真相。
  #
  # 为什么值得单开一个包：这条规则有两个消费者——生产侧（tooldisclose 从目录
  # 派生给模型看的调用形态）与消费侧（ptc 把绑定挂到 host.<净化名> 上并校验
  # 形态里的函数名）。两侧必须**逐字一致**，否则就是「生产侧派得出、消费侧
  # 认不出」的夹缝。
  #
  # 它曾经两边各写一份（规范名写成两份、净化规则又各写一份），于是漂移开了：
  # 生产侧照抄目录原名、消费侧按净化名挂载，契约在文档里写着「直接可用」，
  # 代码里却拒——而旧版测试还把「会被拒」钉成了预期行为，两边的错一起被固化。
  - id: toolname
    roots: [toolname]
    requires: []
    owner: harness
    managed: true
    notes: |
      工具名→程序内可用的 JS 标识符：一条单一真相。
      IsJSIdent（能不能直接用）+ Normalize（不能的话用哪个）。
      规整不保证唯一（get-logs 与 get_logs 同名）——撞不撞由调用方判
      （ptc 在装配期拒，因为顶替意味着副作用错位）。

  # 2026-10-29 新增：事件流 → 轨迹行的投影。
  #
  # 为什么值得单开一个包：「这一轮花了多久」这件事此前没有单点——宿主只能自己
  # 从事件流里拼起止时刻、按 call_id 手工配对工具调用与结果，各拼一套必然漂。
  # 尤其**时长这一个数**：有人拿载荷体积估、有人拿 token 数除、有人按事件时刻
  # 相减——三种口径混进同一张表，谁也说不清哪一列是实测、哪一列是猜的。
  #
  # 本包把口径收成单源：**时长只有起止时刻相减一个出处**，行里不存时长字段
  # （Duration() 现算），于是估算值结构性无处安放——不是靠纪律约束，是装不进去。
  # 配对缺口（缺结果/重复结果/无对应调用/重复声明）显式可见，不静默丢弃。
  - id: ticket
    roots: [ticket]
    requires: []
    owner: harness
    managed: true
    notes: |
      一次性短时授权票据的机制面：签发/单次消费/TTL/用途绑定。消费即作废，
      过期判定与消费判定同一处；绑定载荷原样携带，语义归宿主解释。零内部依赖
      （纯 stdlib），时钟可注入——过期语义要能被确定性测，不靠 sleep。
      票据空间有界且满了显式拒发（默默淘汰会让宿主以为票据还在，实际已失效）。

  - id: trajectory
    roots: [trajectory]
    requires: [eventbus]
    owner: harness
    managed: true
    notes: |
      事件流 → 轨迹行投影：轮次/步骤/工具三类行，起止时刻取自事件时刻，
      时长由起止相减得出（无实测即无值，不拿估算补）；工具调用与结果按 call_id
      配对，缺口进 Issues 显式可见；增量投影支持「先喂一半再喂后半，行被更新
      而非重复」。依赖 eventbus 是为了吃本仓自己的事件词表，不另立事件模型。

  # 2026-10-19 新增：门禁执行体从 package main 下沉为可导入包。
  #
  # 为什么它属于本仓（而不是留在宿主仓各写一遍）：判据是「AST + 一张声明表」，
  # 不认识任何领域概念——**机制面**。而门禁执行体若锁在 package main 里，
  # 别的仓就够不着：于是每个宿主要么各写一遍判据（各判一套，漂移到没人发现），
  # 要么干脆不写（policy 的依赖拓扑表变成死条文：躺在文件里、看起来有人维护过，
  # 实际一条都不判）。
  # 参考运行时示例（v0.32.0 新增）：端到端演示机制怎么串起来。
  #
  # 为什么它是**模块**而不是散落的脚本：未登记的包目录对依赖方向门禁**隐形**——
  # 任何模块都能 import 它而不判违规。于是示例里长出的真实依赖（checkpoint /
  # commitgate / sideeffect / taskboard）就没人管了。
  #
  # 为什么它零新依赖：存储用**纯 stdlib 内存实现**。本仓「依赖面窄」是既有优势，
  # 不为示例牺牲——真实 PostgreSQL 的接入形态由下面的 pgrefstore 模块承担
  # （v0.33.0 起，issue #94）。
  - id: reference-runtime
    roots: [examples/reference-runtime]
    requires: [checkpoint, commitgate, contract, sideeffect, taskboard, "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      参考运行时示例：创建任务 → 多步骤执行 → 中断 → 恢复续跑 → 并发认领 →
      副作用对账。它是**示例**不是能力包：机制面仍在 checkpoint/commitgate/
      sideeffect/taskboard 里，本目录只演示它们怎么接线。

  # PostgreSQL 参考存储（v0.33.0 新增，issue #84 #94 #95 #105）：把 sideeffect /
  # taskboard / checkpoint 的跨进程判据落到真实数据库的原子操作上。
  #
  # 为什么它是**独立示例子包**而不是内核子包：issue #94 的边界声明——它是
  # **参考实现**，不是内核依赖。内核依旧只给契约与判据；把驱动拖进内核的
  # 依赖图，等于让「内核不实现存储」名存实亡。放 examples/ 下，宿主抄它、
  # 不 import 它（参考 examples/reference-runtime 的分工：内存版证判据、
  # 这一份证跨进程）。
  #
  # 为什么 pgx/v5 可以进依赖面：只进**这个示例子包**的依赖图（内核各包
  # requires 均不含它），且驱动是纯 Go（CGO_ENABLED=0 交叉构建不受影响）。
  # 「依赖面窄」的判据是内核的依赖图窄，不是仓库一个驱动都不许见。
  #
  # 为什么它必须登记成模块：未登记的包目录对依赖方向门禁隐形。它的判据
  # 面来自共享契约套件（sidetest / boardtest / RunSinkContract，测试侧 import），
  # 生产侧只允许依赖 checkpoint / sideeffect / taskboard 与 pgx、oekit/pkg
  # ——多引一个机制包就红。
  - id: pgrefstore
    roots: [examples/pgstore, examples/pgstore/cmd/pgsmoke]
    requires: [checkpoint, sideeffect, taskboard, "ext:github.com/jackc/pgx/v5", "ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      sideeffect.Store / sideeffect.FencedSink / taskboard.Board（含 RenewingBoard）/
      checkpoint.StoreCAS 的 PostgreSQL 参考实现 + SIGKILL 故障恢复 e2e + 部署冒烟
      （cmd/pgsmoke）+ docker compose 集成环境。Acquire 三判合一在一个事务里
      （SELECT … FOR UPDATE 行锁），栅栏预占是一条带条件的 upsert，写入体走
      同一事务（不得部分写）。契约判定在共享契约套件（与内存版同一段判据）。

  - id: archcheck
    roots: [archcheck]
    requires: []
    owner: harness
    managed: true
    notes: |
      架构门禁执行体：architecture-policy.yaml 的可执行面（规则判定、门包判定、
      依赖方向判定、policy 自校验、结构阈值）。
      requires 为空：只依赖 stdlib 与 yaml.v3，不依赖本仓任何机制包——
      门禁必须是**最底层**的东西，否则「用它判别人」就变成「它自己也在被判定」，
      门禁的红绿会依赖它所判的代码。

  # 2026-11-06 新增（issue #35）：`cmd/ptcchild` 此前靠 dependency_direction 的
  # 目录级豁免 `[cmd]` 顺带盖住，从未经过任何判定面。
  #
  # 它的性质是「**测试夹具 + 执行入口**」：不作为独立二进制发布，而是被 ptc 的用例
  # `go build` 出来当被测子进程（正常形态回 Result 帧 / noop 形态读掉 stdin 后干等，
  # 用来验证「子进程不回结果时父侧必须限期收场」）。
  #
  # 登记进来的好处是它的依赖边**被真的判着**：它只允许依赖 ptc，多引一个机制包就红。
  # 这比「按目录整棵跳过」严格——后者连「它 import 了什么」都不问。
  - id: ptcchild
    roots: [cmd/ptcchild]
    requires: [ptc]
    owner: harness
    managed: true
    notes: |
      ptc 子进程后端的被测入口（测试夹具，不发布为独立二进制）。
      requires 只有 ptc：它调 `ptc.MaybeRunChild()` 进子进程协议。
      **不含裸执行入口 ptc.Run** ⇒ 执行路径门禁对它是绿的，且是**真的判过**的绿。

  # 2026-11-05 新增：快照式订阅表的**单一实现**（本仓内部件，不进公开 API）。
  #
  # 此前本仓有三份近乎逐字相同的实现：netguard/subscribe.go、pii/subscribe.go、
  # guardset/assembly_subscribe.go。三份包头各自写着「与 netguard 的 notifyPolicy
  # 同款」——**交叉引用本身就是重复的自白**。代价不在多写百来行，而在这是一段
  # **并发正确性代码**（copy-on-write 发布、句柄单调、通知在锁外、回调 panic 隔离）：
  # 只要有一份先被修，另外两份不会跟着改，同一个不变量于是在三个包里有三种成色，
  # 而失效形态是**偶发漏通知 / 偶发误留订阅**——不红不报，只在长跑进程里慢慢显形。
  #
  # 为什么放 internal/ 而不是顶层包：它不是公开 API，是三个包共用的**实现细节**。
  # 顶层包意味着对外承诺（README 包表要给行数、依赖列，且被 docsync 反向收录判定），
  # 而它一旦被宿主直接 import，三个使用方就再也不能自由改它的签名。
  #
  # 判据仍是可判定的（不靠自觉）：requires 为空即纯 stdlib，任何人给它加依赖都会
  # 在此门禁红——这条边就是「零依赖的机制件」这个承诺本身。
  - id: subhub
    roots: [internal/subhub]
    requires: []
    owner: harness
    managed: true
    notes: |
      快照式订阅表的单一实现：atomic.Pointer 整体替换（读侧无锁、永不看到半张名单）、
      Registry.Add/Remove/Notify/Len、由本包铸造的单调句柄（0 = 无效）、
      回调 panic 隔离（Invoke / Do）。
      **零依赖、零公开 API**：语义判定（fn 为 nil 报哪个错、哨兵叫什么）刻意留在
      三个使用方——共用哨兵会让 `errors.Is(err, netguard.ErrNilSubscriber)` 这类
      既有调用点的判定链断掉。

# ── 可执行规则 ──
rules:
  # 规则一（拆分后的头号红线）：harness 不得出现领域词。
  # 拆分做完后最现实的风险不是拆不动，而是业务代码一年年渗回内核，
  # 等发现时 harness 已经退化成「换了个名字的 monolith」。用门禁把它钉死。
  #
  # 分两级执行，避免门禁虚红导致被习惯性忽略：
  #   - 生产代码（ignore_test: true）→ severity: error，违反即红；
  #   - 测试夹具（only_test: true） → severity: warn，只报告不阻断。
  - id: harness-no-domain-vocabulary
    desc: 内核生产代码不得含运维领域词表（词表属于宿主/领域包）
    severity: error
    scope: [.]          # 全仓
    include: ["*.go"]
    ignore_test: true   # 测试夹具由下一条规则单独体检
    scope_exclude: [cmd]
    forbid_regex: '(故障链|巡检流|故障诊断|告警|根因分析|运维|主机构建|本机|远程主机|集群健康|节点诊断|内存分析|IO\s*分析|网络分析|安全基线|变更管控|处置验证|审批单|工单)'
    examples:
      - text: 'var steps = 故障链判定()'
        want: hit
      - text: 'var buf bytes.Buffer'
        want: miss

    # 说明：以上均为**运维领域中文词**。刻意不拦 host/cluster/pod 等通用技术词——
    # 它们在协议字段名（如 ImpactScopes 的 host 级）中合法出现，硬拦会误杀。
    # 判定范围只覆盖「词表/编排图」语境：真正的机制判定（如深度上限、allow 矩阵）
    # 用词是通用的。

  - id: harness-test-fixture-domain-vocabulary
    desc: 测试夹具必须使用合成数据，不得携带真实运维词面
    # 2026-10-18 由 warn 升为 error。长期挂着 warn 的规则等于没有规则——债务
    # 清零后若还留在 warn 级，同一批词面可以无声回涨，且没人会去看告警清单。
    # 清偿记录：15 处 warn 级债（protocol 11 + watchdog 4）已全部改为合成数据，
    # 规则报告归零后才做的这次升级。
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    only_test: true
    scope_exclude: [cmd]
    forbid_regex: '(故障链|巡检流|故障诊断|告警|根因分析|运维|本机|远程主机|集群健康|内存分析|IO\s*分析|网络分析|安全基线|变更管控|处置验证|工单)'
    examples:
      - text: 'name := "运维Agent"'
        want: hit
      # 断言「不得出现某词」的测试意图必须能写出那个词——negative_follow 的
      # 豁免面在这里被样例钉住：锚点写错一个字，这条会从 miss 变 hit。
      - text: 'if strings.Contains(out, "运维") {'
        want: miss

    # 负向前置：**断言「不得出现某词」的用例**本身必须写出那个词，否则无法断言。
    # 这类命中是测试意图而非领域知识，用 negative_follow 结构化豁免（RE2 无后顾断言）。
    # 升 error 后此豁免更关键：protocol/generality_test.go:87 正是断言
    # 「渲染结果不得含『运维』」，没有豁免它会被自己这条规则拦下。
    negative_follow:
      - anchor: 'strings.Contains(out, "'
        forbid_follow: '运维")'
      - anchor: '!strings.Contains(out, "'
        forbid_follow: '运维")'

  # 规则二：harness 不得反向依赖宿主。这是拆分的定义性约束——
  # 一旦 harness import 宿主仓，harness 就永久绑死在运维域上。
  #
  # 两个前缀都要列：宿主仓 2026-10-18 起在 GitHub 上有正式仓
  # yi-nology/bianque，只拦旧私有域名等于给新路径开后门——
  # module path 迁到 github.com/yi-nology/ 之后，import 宿主完全绕得过去。
  - id: harness-no-host-dependency
    desc: 内核不得依赖宿主仓任何包
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    scope_exclude: [cmd]
    # 匹配对象是 **import 路径**（不含引号），不是源码行——实现走 go/ast，
    # 单行/块/别名/空白导入一视同仁（见 archcheck/imports.go）。
    #
    # 路径末尾用 `(/|$)` 而不是裸 `/`：宿主仓的**根包** import 路径没有结尾斜杠
    # （github.com/yi-nology/bianque），只写 `/` 会漏掉它——而那恰恰是最可能被
    # 直接引用的那个包。漏掉的形态是门禁变绿，不是变红。
    forbid_import_regex: 'git\.enjoye\.top/enjoydream/bianque(/|$)|github\.com/yi-nology/bianque(/|$)'
    examples:
      - text: 'github.com/yi-nology/bianque/internal/engine'
        want: hit
      - text: 'github.com/oekit/pkg/errors'
        want: miss


  # 规则三：harness 包不得依赖宿主的运行时原语库。
  # 2026-10-18 起**不再允许门面 agentkit**（上游私有旧门面仓）：
  # 该门面已发至 v1.0.0 并进入退役期，agent 原语统一走 github.com/oagentkit/<mod>。
  # 门禁不认「文档里说过要迁」——不写进机器约束的约定半年后必然回退。
  # 同规则二：新旧两个宿主前缀都列，理由见上。
  - id: harness-no-domain-runtime-deps
    desc: 内核不得引入宿主仓与领域运行时（含已退役的 agentkit 门面）
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: true
    scope_exclude: [cmd]
    forbid_import_regex: 'git\.enjoye\.top/enjoydream/(bianque|ekit|agentkit)(/|$)|github\.com/yi-nology/(bianque|ekit|agentkit)(/|$)'
    examples:
      - text: 'github.com/yi-nology/ekit/flow'
        want: hit
      - text: 'github.com/yi-nology/goagent-kernel/protocol'
        want: miss


  # ── oekit 家规（矩阵一致性）──
  #
  # goagent-kernel 与 oekit 同属一族：oekit=基础库、agentkit=agent 原语、
  # harness=编排内核，三者本该是同一套工程纪律下的产物。harness 曾是矩阵里唯一
  # 不守家规的孤岛——家规只写在别处的文档里，本仓既不执行也不自查。
  #
  # 这三条都不是风格洁癖，每条都对应一个真实故障模式：
  #   - 裸 goroutine 的 panic 无法被外层 recover，会直接杀掉整个进程；
  #   - printf 日志回调一旦焊进公开 API 签名就是不可逆的 API 债；
  #   - 进程内混用第二套 errors 包会打断 BizError 的 As/Is 判定（Not Found 变 500）。

  # 规则四：禁止裸 go func，走 concurrency/async 的 GoSafe（panic 被 recover）。
  - id: harness-no-bare-goroutine
    desc: 生产代码禁止裸 goroutine 启动（panic 无法被外层 recover，会杀进程）；须走 concurrency/async 的 GoSafe
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: true   # 测试需要真 goroutine 来验证阻塞/超时语义，不适用
    # 两种形态都要拦：`go func(){...}()` 与 `go someFunc()`。
    #
    # 旧写法只拦 `go func(`，漏了 `go someFunc()`——而后者的 panic 同样
    # **无法被外层 recover 捕获**（panic 发生在被调函数内部，裸 goroutine 没有
    # 任何 recover 边界），风险与前者完全相同。漏掉的形态是门禁变绿。
    # 第三种形态也拦得住：`go m.Start()` 这类**方法调用**。旧正则要求标识符后
    # 紧跟 `(`，于是带点的调用链整体不命中——而它的 panic 同样无法被外层 recover。
    # 这一处是 examples 自检上线当天抓出来的（正例 `\tgo worker.Start()` 判不中）：
    # 判据比它自己的注释窄，而注释是散文、examples 才是断言。
    forbid_regex: '^\s*go\s+(func\(|(?:[A-Za-z_]\w*\.)*[A-Za-z_]\w*\()'
    examples:
      - text: "\tgo func() {"
        want: hit
      # 第二种形态也必须判得中：裸 goroutine 的 panic 无法被外层 recover，
      # 与是不是匿名函数无关（漏掉这一形态是旧实现的漏洞）。
      - text: "\tgo worker.Start()"
        want: hit
      - text: "\tgoFunc := 1"
        want: miss


  # 规则五：SDK 包不得把 printf 风格日志回调焊进公开 API。
  # 留痕一律走 logx.Delegating 懒解析——宿主用 logx.SetDefault 换后端，
  # 内核不必把日志函数收回参数（那会让每次调用都要包一层 adapter）。
  - id: harness-no-printf-log-callback
    desc: SDK 包不得把 printf 风格日志回调焊进公开 API 签名；留痕走 logx.Delegating
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    scope_exclude: [cmd]
    # 匹配「名为 logf/logFunc/logFn/logger 的参数，其类型是 func(...) 且**首参为 string**」。
    #
    # 首参允许带参数名（`func(format string, args ...any)`）——那才是 printf
    # 回调的常见写法。旧写法 `func\(string` 只认「首参无名的裸 string」，
    # 于是最常见的那种形态（带参数名的 format string）反而漏检。
    forbid_regex: '\b(logf|logFunc|logFn|logger)\s+func\(\s*(?:[A-Za-z_]\w*\s+)?string\b'
    examples:
      # 最常见的那种形态：首参**带参数名**的 format string。
      - text: 'func New(logf func(format string, args ...any)) *X {'
        want: hit
      - text: 'func New(log func(string) error) *X {'
        want: miss


  # 规则六：类型同一性红线——一个进程只允许一套 errors 包。
  # **2026-10-18 已清偿**：oekit/pkg ≥ v0.12.0 起 New/As/Is/Unwrap 与 stdlib 同型透传
  # （`errors.New` 就是 `stderrors.New` 的 shim，见 pkg/errors/std.go），哨兵与 As 判定
  # 单 import 即可，双 import 的老理由已消失，全仓 24 个文件已切换完成。
  #
  # 因此本规则从「只拦第二套」**收紧为「只允许 oekit/pkg/errors 一套」**：
  #   - `^errors$`                   → 禁 stdlib（按**路径**精确匹配，不是子串，
  #                                    否则 github.com/x/errors 之类会被误伤）
  #   - `^github\.com/pkg/errors$`   → 禁同名不同型的第三方包
  # 匹配对象是 import 路径（实现走 go/ast），故单行/块/别名/空白导入一视同仁。
  #
  # 旧实现用 `^\s*"errors"$` 逐行匹配源码文本，只认「整行就是一个裸路径」，
  # 于是 `import "errors"`（单行）、`import e "errors"`（别名）全部漏检——
  # 而本仓大量使用单行 import，这条规则对相当一部分文件从来没生效过。
  - id: harness-single-errors-package
    desc: 全仓只允许 oekit/pkg/errors 一套 errors 包（禁 stdlib errors 与 github.com/pkg/errors）
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    scope_exclude: [cmd]
    forbid_import_regex: '^errors$|^github\.com/pkg/errors$'
    examples:
      - text: 'errors'
        want: hit
      # 同一套 errors 在 oekit 里是**允许**的那一套（路径不同即类型不同）。
      - text: 'github.com/oekit/pkg/errors'
        want: miss


  # 规则八（2026-10-21）：外部程序执行的入口必须唯一。
  #
  # 隔离档位这套机制要成立，前提是「被执行的程序都在某个已登记的后端里跑」。
  # 一旦某个包绕过登记簿直接起一个外部进程，那次执行就没有档位——宿主按
  # 「它在受控后端里」做的风险判断，对那次执行全部落空，而**没有任何信号**：
  # 构建全绿、测试全绿、审计日志里只有一条普通的进程记录。
  #
  # 这类绕过最常见的形态是 os/exec（Go 里起外部进程的标准入口），加进某个包
  # 只要一行。于是本规则把「起外部进程」这件事**收口到 sandbox 包**，
  # 其余生产代码一律不得直接 import。
  #
  # 判定面是 **import 路径**（走 go/ast），故单行/块/别名/空白导入一视同仁。
  #
  # 已知边界（写明，而不是假装覆盖）：本规则只拦 os/exec 这一个标准入口。
  # 直接用 syscall 起进程的形态拦不住——那需要拦整个 syscall 面，代价远大于
  # 收益，且当前本仓生产代码零 os/exec。规则拦的是**常见形态**，不是全部形态。
  - id: harness-sandbox-execution-single-entry
    desc: 外部程序执行只允许经 ptc 执行后端；其余生产代码不得直接 import os/exec
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: true
    # 收口点从 sandbox 迁到 ptc：sandbox 已转为**门面**（核心在 oagentkit/guardx），
    # 而「起外部进程」这件事的实现落在 ptc 的子进程后端（ptc-subprocess）。
    # 收口**一处**的意图不变——仍是「只有一个包能 import os/exec」，
    # 只是那个包从「sandbox 执行面」变成了「ptc 执行面」。
    scope_exclude: [cmd, ptc]
    forbid_import_regex: '^os/exec$'
    examples:
      - text: 'os/exec'
        want: hit
      - text: 'os'
        want: miss


# ── 门面包不可变 ──
#
# 规则七（AST 类，**不在 rules 段**）：门面包只能是门面。
#
# 为什么单独一段而不是加进上面的 rules：rules 段是正则门禁，逐行看文本；「一个函数
# 体是不是只有一条上游转发」是结构性问题，只有语法树能判。执行体在 archcheck/
# facade.go，走 go/ast，不参与正则表。
#
# 为什么必须拦：docs/OAGENTKIT-OVERLAP.md 用散文写了「保持门面，别再在本仓加逻辑」。
# 散文不是门禁。现有七条正则规则查的全是写法（用什么词、import 什么、goroutine 怎么起、
# 回调怎么声明、errors 怎么包），没有一条查「本仓自己的门面有没有被自己改胖」。真有人
# 往 policy/ 里加一份实现，没有规则会响，结果是与上游并存的第二份实现——正是该文档
# 警告的事，却只靠一句人话拦着。
#
# 允许的四类声明（其余一律违规）：
#   type X = upstream.X                      类型别名
#   const X = upstream.X                     常量别名（可成块）
#   func X(...) T { return upstream.F(...) } 单条上游转发
#   import 路径 ∈ upstream ∪ allowed_imports
#
# 「加真逻辑」三者必居其一——要新类型、要多条语句、或要新依赖——所以这条规则不能被
# 「顺手写两行」绕过去。测试文件不在判定面内（构造违规样例本身就是验证手段）。
#
# severity 直接给 error：这三条门包当前零违规，说明纪律还没被破坏过；挂在 warn 上
# 等于给未来的回涨留后门。升 error 前已做反向验证（见 facade.go 包头注释）。
facades:
  - package: dispatch
    desc: 派发守卫门面包，核心在 oagentkit/agent/dispatch
    severity: error
    upstream: ["github.com/oagentkit/agent/dispatch"]

  - package: policy
    desc: 操作审计门门面包，核心在 oagentkit/toolgate/policy
    severity: error
    upstream: ["github.com/oagentkit/toolgate/policy"]
    # 额外依赖是签名本身要求的，不是实现：
    #   - io/fs 是 LoadOverrides 的参数类型；
    #   - eino/components/tool 是 WithAuditGate 的出入参；
    #   - guardx/invoke 是 Stage 的返回类型（判定环的一环）。
    # 三者都不提供任何实现。
    allowed_imports: ["io/fs", "github.com/cloudwego/eino/components/tool", "github.com/oagentkit/guardx/invoke"]

  - package: reminder
    desc: 系统注入防伪包裹门面包，核心在 oagentkit/guardx/injectband
    severity: error
    upstream: ["github.com/oagentkit/guardx/injectband"]

  - package: toolfail
    desc: 工具失败分类门面包，核心在 oagentkit/guardx/toolfail
    severity: error
    upstream: ["github.com/oagentkit/guardx/toolfail"]

  - package: sandbox
    desc: 执行沙箱档位门面包，核心在 oagentkit/guardx/sandbox
    severity: error
    upstream: ["github.com/oagentkit/guardx/sandbox"]
    # 额外依赖是签名本身要求的，不是实现：context 是 Execute 的 ctx 参数类型，
    # Provider.Exec 的 ctx 参数类型也是它。本包不提供任何实现。
    allowed_imports: ["context"]

# ── 包间依赖方向 ──
#
# modules 段的 requires 此前**只有声明、没有执行体**：archcheck/policy.go 把 modules
# 反序列化成 `[]struct{}`，requires 连内存都没进，于是 README 宣称的
# 「域词污染 + 依赖方向」里「依赖方向」那一半是空的。且声明已经开始漂移
# （watchdog 写 requires: []，实际 import 了 eventbus）——没人发现，
# 因为没有东西会去读它。执行体见 archcheck/deps.go（go/ast 判 import）。
#
# 为什么值得做成门禁：依赖缠绕是本仓最难靠 review 发现的债。它零报错、零告警、
# 构建全绿——每个单点 import 看起来都合理，只有把全图摊开才看得出 A→B→C→A。
# 其余七条正则规则查的全是「写法」（用什么词、import 什么、goroutine 怎么起），
# 没有一条查「包与包之间允许连成什么形状」。
#
# 判定路径三条：
#   1. 越界依赖：包 A 的生产代码 import 了包 B，而 A 的 requires 未登记 B。
#   2. 越界跨仓依赖：A import 了落在**受管外部包面**内的包，而 A 的 requires
#      未登记它（登记形态：`ext:<import 路径前缀>`）。
#   3. 未登记包：含生产 Go 文件的**包目录**未被任何 root 覆盖——未登记的包对本门禁
#      隐形，任何模块都能 import 它而不被判违规。这是该规则最大的盲区。
#
# requires 的条目有两种形态：
#   - `<模块 id>`：本仓内部模块，必须在 modules 段登记过（写错 id = policy 解析失败，
#     不静默降级——否则「这条边是否被允许」变成永远为假的判定）。
#   - `ext:<import 路径前缀>`：外部包面，用于表达跨仓依赖。机制面迁到外仓之后，
#     宿主的依赖拓扑表需要能表达「我依赖外仓的哪个包」，而只认本仓模块 id 的判据
#     表达不了。登记后该前缀成为受管包面，任何模块 import 落在其中却没登记 → 越界。
#
# 判定面只含生产代码（跳过 _test.go）：依赖方向决定交付物里出现什么，测试依赖
# 是临时的、可随用例删掉的；纳入测试会逼出「只为共享夹具而做的注册」噪声，
# 反而削弱规则可信度。
#
# severity 直接给 error：登记项当前零违规（声明与代码事实一致后才允许升 error），
# 挂在 warn 上等于给未来回涨留后门。已做反向验证（注入越界依赖 / 未登记目录
# → 门禁报错 + 退出码 1）。
dependency_direction:
  enabled: true
  severity: error
  desc: 包间依赖必须先在 modules 段登记 requires；跨仓依赖用 ext:<import 路径前缀> 登记；未登记的包目录对门禁隐形，须补登记
  # 豁免**逐包列举**，不给目录前缀（issue #35）。
  #
  # 前缀豁免的通病是「今天写它时只想着两个包，明天多一个也没人重新判断」。
  # 本仓真实发生过：这行原写 `[cmd, docs]`，理由写的是「archcheck / docsync 是
  # 工具包」；而当时 cmd/ 下**已有三个包**，第三个 `ptcchild` 既不是门禁工具也不是
  # 文档工具（它是 ptc 子进程后端的执行入口），却被同一条前缀豁免顺带盖住了，
  # 且没有任何信号——理由点名 2 个、实际豁免 3 个。
  #
  # 逐个列举之后，新增 `cmd/xxx` 会当场报「未登记的包目录」，逼人重新判断它是
  # 什么：是工具（加到这里）、还是值得被依赖方向管住的模块（登记进 modules 段）。
  #
  #   cmd/archcheck、cmd/docsync、cmd/pkgcov  门禁 / 文档工具：import 各包是工具
  #                                            职责，不是机制依赖。
  #   （cmd/ptcchild 不在此列——它已作为模块登记在 modules 段，见该条 notes）
  ignore_dirs: [cmd/archcheck, cmd/docsync, cmd/pkgcov, docs]
  # ── 受管外部包面（policy 级）──
  #
  # 第一方矩阵（oagentkit / oekit）整体纳入依赖方向的判定面。
  #
  # 为什么必须管：上游把能力搬家的频率不低——2026-10-20 这一轮就搬了两处
  # （toolgate/invoke → guardx/invoke、obs/obsx → llm/obsx）。而本仓的依赖
  # 方向表此前**只管内部包**（本仓包与包之间），管不到「本仓用了哪个上游矩阵
  # 模块」——于是那次搬家在本仓的门禁眼里**什么都没发生**：import 路径变了、
  # 依赖面变了（判定环从 eino 重仓挪到零依赖底座），但没有任何一处声明跟着改。
  #
  # 声明面分两层（与内部模块同构）：
  #   - 受管面（这里）：第一方矩阵整体
  #   - 逐模块的边（modules 段的 requires）：本包实际用了哪个上游矩阵模块
  #
  # 粒度选**矩阵模块**级（如 ext:github.com/oagentkit/guardx）而不是包级：
  # 包级会把 requires 撑成 import 清单（每换一个包名就是一次声明变更），
  # 模块级则正好表达「本包依赖矩阵的哪一块」。
  #
  # 第三方依赖（goja / eino / jsonschema 等）**不在**受管面内——它们由
  # forbid_import_regex 那几条规则管（禁宿主、禁宿主运行时），不需要逐包声明。
  ext_prefixes:
    - github.com/oagentkit
    - github.com/oekit
    # PostgreSQL 驱动（v0.33.0 起，issue #94）：只被 examples/pgstore 的
    # requires 引用（PG 参考实现）。它进不了内核任何包的依赖图——
    # 登记在这里是让「谁在用 pgx」可判：内核包若 import 它，依赖方向门禁
    # 当场红（内核不实现存储，判据面不拖驱动）。
    - github.com/jackc

# ── 执行沙箱后端的档位登记 ──
#
# 「模型写的程序在哪跑、跑起来能触达什么」此前只有一个答案：进程内 goja VM（ptc），
# 而那个答案是**写死在调用点**的——没有档位概念，也没有「这次执行至少要多强」的
# 表达。于是宿主想跑一段不可信程序时，「它跑在够强的隔离里吗」这件事无处声明，
# 只能靠人记得别挑错后端。
#
# sandbox 包把它变成机制（Level 档位 + Provider 协议 + Registry），但**机制不等于
# 信任**：档位是后端自报的，后端若标了比实际更强的档位，宿主据此做的风险判断全部
# 落空，而构建全绿、测试全绿、日志里只有一条普通的进程记录。
#
# 这一段就是档位声明的**签字处**：每个后端一条登记（标识、档位、所在包），
# 「它凭什么说自己有这一档」写在该条的 notes 里——那是人 review 时会看到的地方。
#
# 执行体见 archcheck/sandbox.go（go/ast 判定），核对两件事：
#   1. 登记 ↔ 代码事实一致（档位漂移 = 代码改了登记没改）；
#   2. 实现 ↔ 登记齐全（未登记的后端，其档位声明不在被复核的清单里）。
#
# ⚠️ 这条门禁**判不了**「后端实际提供的隔离强度是否兑现其声明」——那要审实现。
# 它保证的是：声明可见（在 policy 里）、不漂移（门禁核对）、有签字（人 review）。
#
# level 填 sandbox 包的档位**常量名**（LevelNone/LevelProcess/LevelOS/LevelMachine）
# 而不是档位值（process/os/machine）：门禁不能 import 被判的包（它必须是最底层，
# 否则「用它判别人」就变成「它自己也在被判定」），故它只能比对代码里可静态识别的
# 那一面——常量名。两侧共用同一份真相，不另造映射表。
sandbox_providers:
  enabled: true
  severity: error
  desc: 执行沙箱后端的隔离档位必须登记在 sandbox_providers 段，且与代码事实一致（档位声明要有人签字）
  # 逐包列举，理由同 dependency_direction（issue #35）：前缀豁免会**无声地**把
  # 将来新增的 cmd 子包一起盖住。这三个是工具，它们不实现 sandbox.Provider。
  ignore_dirs: [cmd/archcheck, cmd/docsync, cmd/pkgcov, docs]
  providers:
    - id: gatecheck-managed
      level: LevelProcess
      package: gatecheck
      # 预算支持面：受管后端是**包装层**——它委派给内层后端执行，
      # 故预算支持面**就是内层后端的**。这里声明基本三闸（与 ptc-goja 同款），
      # 真实能力以内层后端自己的登记为准。
      supports: [wall_clock, max_calls, max_bytes]
      notes: |
        联合判据的受管后端：把审批层与沙箱层合成一条判定，判定不通过就**不委派**
        （副作用不会发生）——判据与执行不可分，否则「判过的后端 ≠ 实际跑的后端」
        就又有了信号落差。

        它对外声明的档位是**保证的隔离强度下限**（LevelProcess），不是内层后端的
        实际档位：档位登记门禁要求 ID()/Level() 是**可静态识别的常量**
        （「档位声明要有人签字」——运行期才知道的值无从签字），
        而实际跑哪个档位的内层后端由 Check 在运行期用登记簿判。

    - id: ptc-goja
      level: LevelProcess
      package: ptc
      # 预算支持面：只兑现基本三闸，**不兑现内存**。
      #
      # 为什么如实写「不兑现」：进程内 goja VM 跑在宿主进程里，而 Go 运行时没有
      # 「只给一个 VM 限内存」的开关，goja 公开 API 也没有内存限制（只有
      # SetMaxCallStackSize，那是栈深）。故它**真兜不住**内存——一个快速分配的
      # 程序能在 deadline 到点之前把宿主进程撑爆，而宿主里还跑着编排引擎。
      #
      # 上游 Capable 的缺省语义是「不实现即只兑现三闸」，本包如实落在缺省那一侧：
      # 宿主若要求 MaxMemory，登记簿**不会选中本后端**（要求与实际之间不允许有
      # 静默落差）。真要兜住内存只能把执行搬出宿主进程——设计见
      # docs/SANDBOX-DESIGN-20261021.md。
      supports: [wall_clock, max_calls, max_bytes]
      notes: |
        进程内 goja 解释器：能力面靠 JS 子集 + 绑定白名单裁剪，资源面靠三重预算。
        这层约束由**解释器自己执行**，不是内核强制——故档位是 LevelProcess 而非
        LevelOS。标成 LevelOS 就是让档位表说谎，而档位表是宿主做风险判断的依据，
        说谎的成本落在宿主身上。

    - id: ptc-subprocess
      level: LevelProcess
      package: ptc
      # 预算支持面：**兑现内存**（子进程 + 内核地址空间上限 RLIMIT_AS）。
      #
      # 与 ptc-goja 的差别就在这一维：能力面两者同级（都是 JS 子集 + 绑定白名单），
      # 强的只是**资源面**——执行搬出了宿主进程，内存由内核封顶。
      #
      # 进程内形态兜不住内存（Go 运行时没有「只给一个 VM 限内存」的开关，goja
      # 公开 API 也没有内存限制），故它**不实现** Capable，缺省即「只兑现三闸」。
      # 两个后端由此在登记簿里可区分：要求 MaxMemory 时，进程内后端**不被选中**
      # （要求与实际之间不允许有静默落差），子进程后端被选中。
      supports: [wall_clock, max_calls, max_bytes, max_memory]
      notes: |
        子进程执行后端：程序在子进程里跑，用内核地址空间上限兑现 MaxMemory。
        程序被内核杀掉时，父侧从管道 EOF 认出「执行域异常终止」——不是「程序返回空」。
        跨进程调用协议归上游 guardx/sandbox/wire（帧格式 + 两条通道 × 四个角色）；
        判定环与宿主工具留在父侧，故子进程形态**不弱化门禁**。
        宿主接入成本一行：main 开头调 ptc.MaybeRunChild()。

# ── 执行路径门禁（execution_paths 段）──
#
# 执行必须经 sandbox 登记簿：绕开登记簿直接调裸执行入口，档位下限、
# 预算可兑现性与审批门三层会**同时**失效——而这三条正是宿主据以做风险判断的依据。
# 声明还在，强制没了，门禁全绿。
execution_paths:
  enabled: true
  severity: error
  desc: 执行必须经 sandbox 登记簿（sandbox.Execute），不得直接调用裸执行入口
  # ✅ 本段**不豁免 cmd**（issue #35）：门禁工具与文档工具自己不执行任何第三方
  # 程序，本来就不需要这条豁免——而 cmd/ptcchild 恰恰是「会真实起子进程、并让
  # 父侧验证『不回结果时必须限期收场』」的程序，是这条判定面最该看一眼的对象。
  # 它现在被判定面覆盖着（它调的是 ptc.MaybeRunChild，不是裸入口 ptc.Run，故合规）。
  #
  # 判定面覆盖它是**有意义的信号**：哪天有人把它改成直接调 ptc.Run，这条门禁会红。
  # 按目录豁免的写法下，那种改动从来不会经过任何判定面。
  ignore_dirs: [docs]
  # 本仓自己的裸执行入口登记在**判据执行体的内置表**里
  # （archcheck/execution.go 的 builtinRawEntries）——那是本仓的 API 事实，
  # 让每个仓各登记一份就是**两份真相**（宿主改了登记、本仓没改，两边各判一套，
  # 漂移到没人发现为止，且没有任何信号：门禁都绿）。
  #
  # 这里只登记**别的仓**的裸入口（宿主自己的）。本仓没有——本仓的裸入口只有
  # ptc.Run 一条，且它只在本仓的 ptc 包内部被调用（无限定符 ⇒ 不是绕过）。
  raw_entries: []

# ── 子进程出口 ──
#
# 每个 **os/exec 启动点**都必须在这里登记它的出口档位。这是 P0-2 的后半：
# egress 给了词表与判据（env 生成 / Verify / 后端能力问询），但词表不会自己跑到
# 子进程上——子进程起来之后，它的出站流量完全在本进程 netguard 之外，
# 「声明了受限出口」在那一侧**没有任何东西兑现**，而报告全绿，因为没有判据在问
# 「这个 spawn 点在强制面内吗」。
#
# 判据五条（执行体见 archcheck/egresspaths.go）：
#   1. **未登记的启动点即红**——方向是 fail-closed：「没登记」不等于「不要求出口」，
#      而是「没人声明过它的出口是什么」。放成宽松侧的话，加一个 spawn 点就是一次
#      静默扩大判定面：未登记的启动点越多，判定面越小。
#   2. **mode: proxy 的必须在启动函数里看得见兑现的两半**：① env 的生成/校验
#      （Env / Verify 调用）② **后端能力的问询**（SatisfiedBy 调用）。
#      只看得见 ① 时，「声明了但没人执行」这一态拦不住——环境变量只是**建议**，
#      一个能改 env 却没有任何强制面的后端照样让流量自由出网，而「env 生成了、
#      挂上了」在报告里看起来就是「已兑现」。② 问的正是那一半：你**能强制**
#      这一档吗，问不到即不起子进程。两半分开报错（unplumbed / unprobed），
#      因为修法完全不同（加 Env vs 加后端）。
#   3. **mode: denied 直接红**——环境变量拦不住静态二进制、UDP 与原始 socket，
#      写在登记里等于把「假装禁网」写进 policy。禁网只能由带能力声明的后端强制。
#   4. **陈旧登记即红**——文件/函数不存在，或那个函数里没有启动调用。
#      声明与事实偏离而无人红，是无声漂移（与「陈旧包根当天即红」同一把尺子）。
#   5. **不得把全量环境交给子进程**（os.Environ() / procx.InheritAllExcept 即红，
#      **不看登记档位**）。后者是 runtime v0.10.0 新增的「全量继承 + 剔除若干」入口，
#      给「SDK 包装用户自己的 CLI」那种可信父进程场景用——本仓的子进程跑的是模型写的
#      程序，用在这里等于把侧门重新开回来；而它名字里没有 Environ，只认 os.Environ 的
#      判据对它**静默放行**。上游多一个函数 ≠ 本仓多一条合法路径。
#      这条与 1~4 正交：登记段回答「出站策略是什么」，本条回答「子进程能看见宿主的
#      哪些秘密」。登记成 unrestricted 的启动点同样不该继承整份环境——子进程是模型
#      写的程序，它的隔离面是 JS 子集而非 OS 沙盘，整份环境里有 provider 的 API key、
#      对象存储令牌、数据库口令，程序没有网络也没有 exec，但它能读到秘密再写进返回值。
#      **判定粒度是文件**（不是启动函数）：环境 base 常由辅助函数生成（childBaseEnv /
#      buildEnv 这类），含 spawn 的函数里只剩一句调用——实测把 os.Environ() 放进辅助
#      函数，函数级判据一条都不报、退出码 0。代价是「文件里另有无关的 os.Environ()」
#      会假红，这一方向是刻意选的：红可见可讨论（走 exceptions 登记原因与拆除条件），
#      绿不可见。
#
# 判定面覆盖的形态（收集器在 archcheck/spawnsites.go）：限定符调用（**别名**同样命中，
#      按 import 路径解析不按名字猜）、**点导入**（`import . "os/exec"`，调用没有限定符）、
#      **包级初始化**（`var cmd = exec.Command(...)`，不在任何函数里）。入口表按 import 路径归，
#      除 os/exec 还含 os.StartProcess 与 syscall.Exec/ForkExec/StartProcess——它们同样绕开
#      出口强制面，也各自接受 Env。这三类形态都是 2026-11-06 注入实测出的漏判：换一种写法
#      就能让门禁一声不响地全绿，而「换写法」不是恶意的，是重构的自然产物。
egress_paths:
  enabled: true
  severity: error
  desc: 每个子进程启动点都必须登记出口档位；要求经代理的必须在 spawn 之前既看得见 env 的生成/校验、也看得见后端能力的问询（只生成 env 证明不了它被执行面强制）；且不得把全量环境（os.Environ）交给子进程
  entries:
    - path: ptc/childpipes.go
      fn: newChildPipes
      mode: proxy
      notes: |
        ptc 子进程后端的唯一 spawn 点（re-exec 宿主自己的可执行文件）。兑现的两半都在
        newChildPipes 里：Spec.SatisfiedBy(opts.EgressBackend) 先问「这个后端能强制这一
        档吗」（问不到即不起子进程），再由 Spec.Env 把它落成子进程变量。登记成 proxy 是
        **结构性事实而非本仓的策略选择**：本仓给这一层能施加影响的唯一时点就是 spawn
        之前，故这里保证的是「只要宿主声明了代理，env 一定按声明生成，生成不出就不起
        子进程」——SubprocessOptions.Egress 的零值（不限制）逐字返回原 env，旧调用点行为
        不变。真正的强制（代理本体、deny 列表）归上游与宿主：本仓不造第二套网络栈。

# ── 全局阈值 ──
thresholds:
  max_file_lines: 400
  # 单类型方法数上限——god object 的机械判据。
  #
  # 为什么单独设一条：大文件不等于大对象。1026 行的装配函数与 1026 行的纯声明文件
  # 性质完全不同；而「一个类型挂了 N 个方法」是**可自动发现**的结构债——方法越多，
  # 任何一次改动要在多大的影响面上评估，全凭这个数。宿主仓实测出现单类型 175 个方法
  # 的实例，故此判据比行数更能提前报警。
  #
  # ⚠️ 本条比的是**实质方法数**，不是方法总数（见下方 forwarding_shell_max_chars）。
  max_methods_per_type: 25
  # 「转发壳」的方法体长度上限（字符）——god object 阈值**不计入**转发壳。
  #
  # 转发壳 = 方法体只有一条转发语句（一次调用 / 一次返回转发值）、且剥掉注释与空白后
  # 长度不超过此值。
  #
  # 为什么要有这一条（issue #13）：方法数超阈值的**前提**是「该类型同时承担了过多
  # 关注点」。这个前提对**退化成 façade 的类型**不成立——把实现下沉到子包、自己只做
  # 转发的 façade 承担了零关注点，它的方法数 ≈ **公共 API 表面规模**，是另一个量。
  # 把 API 表面规模判成复杂度集中，会逼维护者在「撤销一次正确的重构」与
  # 「调高阈值（等于放弃判据）」之间二选一——**两个都是坏选择**。
  # 这就是「假红」最坏的形态：报错把正确的工作判成错的，判据对最该被表扬的宿主
  # 最不友好。
  #
  # 刻度依据：宿主实测样本里，一个 45 方法的纯 façade 有 39 个方法体 ≤140 字符、
  # 只有 4 个超过 400 字符；而三个真 god object 对照组（47 / 46 / 42 方法）的
  # 转发壳占比是 **0%**——即 140 这个刻度能把「拆干净的 façade」与「真复杂」分开，
  # 且**不改变对照组的判定**。
  #
  # 显式写 0 = 关闭该区分（所有方法都算实质方法），判定逐字退回旧行为。
  # 不写 = 用缺省值 140。老 policy 不需要改即可享受修正。
  forwarding_shell_max_chars: 140
  # scan_roots 必须**覆盖 modules 段的全部 roots**——漏一个包，该包对上面两条
  # 阈值就完全隐形（可以长到任意行数、挂任意多方法而不报）。
  #
  # 2026-10-19 补齐：guardset 早已登记在 modules 段（依赖方向门禁管着它），
  # 却一直漏在 scan_roots 之外，于是「超长文件」「god object」两条阈值对它
  # 从来不生效——两条都只差一个字面量，谁也不会发现。
  # 现在由 archcheck 的 policy 自校验强制两者一致（漏一个即门禁红）。
  scan_roots: [protocol, statemachine, eventbus, policy, spill, pii, netguard, dispatch, ptc, sandbox, watchdog, delta, pending, reminder, drain, contract, checkpoint, commitgate, budget, offload, tooldisclose, toolfail, guardset, toolname, sideeffect, sidetest, retryplan, cmdpolicy, egress, preset, sessionref, taskboard, taskboard/boardtest, skilldisclose, hookengine, memorypipe, delegate, worktree, gatecheck, trajectory, ticket, archcheck, internal/subhub, cmd, examples/reference-runtime, examples/pgstore, examples/pgstore/cmd/pgsmoke]
  enforce: true
  # enforce=true 时超阈值即非零退出。切换条件（两条均已满足，2026-10-18 切换）：
  #   1) 现存超限项清零或显式登记为债；
  #      ——3 处超长文件已拆分归零：
  #        protocol/report_types.go    660 → report_types(329) + report_charts(341)
  #        protocol/report_test.go     782 → report_test(373) + report_charts_test(227)
  #                                       + report_tolerance_test(196)
  #        cmd/archcheck/main.go       490 → main(175) + policy(84) + scan(253)
  #        （2026-10-19 起执行体整体下沉为 archcheck/ 包，cmd/archcheck 只做装配）
  #   2) 接入 CI（本地 gate 会被习惯性绕过，CI 不会）——本门禁在 make check 里，
  #      而 make check 就是 CI 唯一执行物。
  # god object 判据（max_methods_per_type）当前零违规，随本条一并转为阻断。

