# examples/docker-compose.yml —— 参考部署 + 契约验证的合流环境（issue #105）。
#
# 一套 compose 同时服务两件事：
#
#   1. **参考部署**（默认 profile）：PostgreSQL + 参考宿主冒烟（pgsmoke）——
#      「一条命令起环境并跑通冒烟」：
#        docker compose -f examples/docker-compose.yml up --abort-on-container-exit --exit-code-from smoke
#      退出码 0 = 冒烟通过（副作用闸 / 栅栏下游 / 任务认领全部落在 PostgreSQL 上）。
#
#   2. **契约验证**（verify profile）：同一套 sidetest / boardtest / 栅栏套件
#      + SIGKILL 故障恢复 e2e 跑在真实 PostgreSQL 上（issue #94 / #95 的验收路径）：
#        docker compose -f examples/docker-compose.yml --profile verify up \
#          --abort-on-container-exit --exit-code-from contract
#      套件不为任何实现开后门：场景级硬失败，跑不过就是跑不过。
#
# 本地开发更快的路径（复用宿主 Go 工具链，不在容器里编译）：
#        make integration        # 起 postgres → go test ./examples/pgstore/ → down
#
# Kubernetes：可选 profile，不是默认路径——compose 里的三个角色（数据库 /
# 参考宿主 / 契约验证 job）分别映射为 StatefulSet（带持久卷）+ Deployment +
# Job；无云环境时不必搭它，compose 已覆盖本仓的全部可验证面。

name: gak-reference

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gakref
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gakref"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 参考宿主冒烟（默认 profile）：起环境即验证部署可用。
  smoke:
    image: golang:1.27.4-alpine
    working_dir: /src
    environment:
      GAK_PGREF_DSN: postgres://postgres:postgres@postgres:5432/gakref?sslmode=disable
    volumes:
      - ..:/src # 仓库根挂进容器（相对本文件）
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    command: go run ./examples/pgstore/cmd/pgsmoke

  # 契约验证（verify profile）：共享契约套件 + 故障恢复 e2e，全部真跑。
  # 首次运行要在容器里拉模块（挂了命名卷缓存，之后增量）。
  contract:
    image: golang:1.27.4-alpine
    working_dir: /src
    environment:
      GAK_PGREF_DSN: postgres://postgres:postgres@postgres:5432/gakref?sslmode=disable
    volumes:
      - ..:/src
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    command: go test ./examples/pgstore/ -count=1 -timeout 15m
    profiles: [verify]

volumes:
  go-mod-cache:
